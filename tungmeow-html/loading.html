<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TungMeow — Loading</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700&display=swap">
<link rel="stylesheet" href="shared.css">
<style>
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;}
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  .spinner { animation: spin 1s linear infinite; transform-origin: 50% 50%; display: block; }
  .mascot { animation: bob 1.6s ease-in-out infinite; }
  .splash{width:100%;max-width:390px;min-height:100vh;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);overflow:hidden;}
</style>
</head>
<body>
  <div class="splash">
    <div class="mascot" style="width:96px;height:96px;margin-bottom:22px;">
      <svg viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="48" cy="48" r="46" fill="var(--orange-soft)"/>
        <path d="M28 30 L20 14 L38 24 Z" fill="#3a2f28"/>
        <path d="M68 30 L76 14 L58 24 Z" fill="#3a2f28"/>
        <ellipse cx="48" cy="52" rx="30" ry="27" fill="#3a2f28"/>
        <ellipse cx="38" cy="48" rx="4.2" ry="5.5" fill="#fefcf9"/>
        <ellipse cx="58" cy="48" rx="4.2" ry="5.5" fill="#fefcf9"/>
        <path d="M45 58 Q48 61 51 58" stroke="#fefcf9" stroke-width="2.4" stroke-linecap="round" fill="none"/>
        <circle cx="30" cy="58" r="3" fill="var(--orange)"/>
        <circle cx="66" cy="58" r="3" fill="var(--blue)"/>
      </svg>
    </div>

    <div style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:24px;color:var(--ink);margin-bottom:2px;">TungMeow</div>
    <div style="font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:36px;">ตังค์เหมียว</div>

    <svg class="spinner" width="34" height="34" viewBox="0 0 96 96" fill="none">
      <circle cx="48" cy="48" r="38" stroke="var(--blue-soft)" stroke-width="9"/>
      <path d="M48 10 A38 38 0 0 1 86 48" stroke="var(--blue)" stroke-width="9" stroke-linecap="round"/>
    </svg>

    <div style="position:absolute;left:0;right:0;bottom:56px;text-align:center;font-size:12px;font-weight:600;color:var(--ink-soft);">Syncing with Google Sheets…</div>
  </div>

  <script>
    // Demo-only auto-advance so the flow reads naturally when opened standalone.
    setTimeout(() => { window.location.href = 'dashboard.html'; }, 1800);
  </script>
</body>
</html>
